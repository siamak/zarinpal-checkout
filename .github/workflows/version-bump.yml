name: Version Bump

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  bump:
    name: Bump version and tag
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      !contains(github.event.workflow_run.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    concurrency:
      group: version-bump
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine next version
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if git rev-parse "v${CURRENT_VERSION}" >/dev/null 2>&1; then
            pnpm version patch --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            NEW_VERSION="$CURRENT_VERSION"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: steps.version.outputs.bumped == 'true'
        run: |
          git add package.json
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Create and push tag
        id: tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Tags pushed with GITHUB_TOKEN don't trigger the Release workflow's
      # push event, so dispatch it explicitly on the new tag.
      - name: Trigger npm release
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref "v${{ steps.version.outputs.version }}"
